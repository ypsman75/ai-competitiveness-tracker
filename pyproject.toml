[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-competitiveness"
version = "0.0.1"
description = "AI competitiveness tracker comparing EU27, United States and China using transparent public data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ypsman75" }]
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    "streamlit>=1.40",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
